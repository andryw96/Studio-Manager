name: Crea installer (Mac e Windows)

# Si avvia a mano: scheda "Actions" > "Crea installer (Mac e Windows)" > "Run workflow".
# Questa versione crea da sola la cartella "desktop": nel repository bastano index.html, icon.svg e icon-512.png.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla i file dell'app
        shell: bash
        run: |
          for f in index.html icon.svg icon-512.png; do
            if [ ! -f "$f" ]; then echo "::error::Manca il file $f nella cartella principale del repository: caricalo e rilancia."; exit 1; fi
          done
      - name: Prepara il pacchetto desktop
        shell: bash
        run: |
          mkdir -p desktop/app desktop/build
          cp index.html icon.svg icon-512.png desktop/app/
          cp icon-512.png desktop/build/icon.png
          cat > desktop/main.cjs <<'MAIN_EOF'
          const { app, BrowserWindow, shell, Menu } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1440, height: 900, minWidth: 900, minHeight: 600,
              title: 'Studio Manager', backgroundColor: '#0c1311',
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            win.loadFile(path.join(__dirname, 'app', 'index.html'));
            // i link esterni si aprono nel browser, non dentro l'app
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            win.webContents.on('will-navigate', (e, url) => { if (!url.startsWith('file://')) { e.preventDefault(); shell.openExternal(url); } });
          }
          Menu.setApplicationMenu(Menu.buildFromTemplate([
            ...(process.platform === 'darwin' ? [{ role: 'appMenu' }] : []),
            { role: 'editMenu' }, { role: 'viewMenu' }, { role: 'windowMenu' },
          ]));
          app.whenReady().then(() => { createWindow(); app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); }); });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          MAIN_EOF
          cat > desktop/package.json <<'PKG_EOF'
          {
            "name": "studio-manager-desktop",
            "version": "1.0.0",
            "private": true,
            "description": "Studio Manager, gestionale per studio di registrazione",
            "author": "Studio Manager",
            "main": "main.cjs",
            "scripts": { "start": "electron .", "dist": "electron-builder --publish never" },
            "devDependencies": { "electron": "^33.0.0", "electron-builder": "^25.1.8" },
            "build": {
              "appId": "it.studiomanager.app",
              "productName": "Studio Manager",
              "directories": { "output": "release", "buildResources": "build" },
              "files": ["main.cjs", "package.json", "app/**/*"],
              "artifactName": "StudioManager-${version}-${os}-${arch}.${ext}",
              "mac": { "category": "public.app-category.business", "target": [{ "target": "dmg", "arch": ["arm64", "x64"] }] },
              "win": { "target": [{ "target": "nsis", "arch": ["x64"] }] },
              "nsis": { "oneClick": false, "allowToChangeInstallationDirectory": true, "perMachine": false }
            }
          }
          PKG_EOF
      - name: Installa gli strumenti
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Crea l'installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-manager-${{ matrix.label }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
