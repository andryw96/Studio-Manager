name: Crea installer (Mac e Windows)

# Si avvia a mano: scheda "Actions" > "Crea installer (Mac e Windows)" > "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copia l'app dentro il pacchetto
        shell: bash
        run: |
          mkdir -p app
          cp ../index.html ../icon.svg ../icon-512.png app/
      - name: Installa gli strumenti
        run: npm install --no-audit --no-fund
      - name: Crea l'installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-manager-${{ matrix.label }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
