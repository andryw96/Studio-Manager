<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Studio Manager">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Studio Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: barra laterale fissa con i moduli, area di lavoro a destra che scorre da sola.
     Palette: neutri con inclinazione verde-acqua, un solo accento (verde petrolio).
     Numeri e unità (Hz, mm, €) in carattere a spaziatura fissa, come gli strumenti di misura. */
  :root {
    --bg: #eef2f1; --surface: #ffffff; --surface-2: #e7edeb; --surface-3: #dbe3e0; --line: #cfd8d5;
    --fg: #14201d; --muted: #53635e; --accent: #0f766e; --accent-fg: #ffffff; --accent-soft: #d3ece8;
    --ok: #1c8a5c; --warn: #b4700f; --danger: #c0344d; --info: #2457d6;
    --c1: #0f766e; --c2: #2457d6; --c3: #cf7a1f; --c4: #7c5cc4; --c5: #c2416b; --c6: #7a8f1f; --c7: #0e8fbf; --c8: #6b7a8c;
    --axial: #2457d6; --tangential: #cf7a1f; --oblique: #7b8794;
    --band-critical: rgba(192, 52, 77, 0.16); --band-gap: rgba(180, 112, 15, 0.15);
    --shadow: 0 8px 28px rgba(10, 30, 26, 0.18);
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1311; --surface: #131d1a; --surface-2: #1b2824; --surface-3: #25352f; --line: #2b3c37;
      --fg: #e4ece9; --muted: #8fa39d; --accent: #3fc1b0; --accent-fg: #04201c; --accent-soft: #163530;
      --ok: #4cc797; --warn: #e8b04f; --danger: #ff7c8f; --info: #7aa2ff;
      --c1: #3fc1b0; --c2: #7aa2ff; --c3: #f2a75e; --c4: #b199ee; --c5: #ef7fa1; --c6: #b5cb55; --c7: #55c2ec; --c8: #94a3b4;
      --axial: #7aa2ff; --tangential: #f2a75e; --oblique: #8e9aa8;
      --band-critical: rgba(255, 124, 143, 0.2); --band-gap: rgba(232, 176, 79, 0.17);
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1311; --surface: #131d1a; --surface-2: #1b2824; --surface-3: #25352f; --line: #2b3c37;
    --fg: #e4ece9; --muted: #8fa39d; --accent: #3fc1b0; --accent-fg: #04201c; --accent-soft: #163530;
    --ok: #4cc797; --warn: #e8b04f; --danger: #ff7c8f; --info: #7aa2ff;
    --c1: #3fc1b0; --c2: #7aa2ff; --c3: #f2a75e; --c4: #b199ee; --c5: #ef7fa1; --c6: #b5cb55; --c7: #55c2ec; --c8: #94a3b4;
    --axial: #7aa2ff; --tangential: #f2a75e; --oblique: #8e9aa8;
    --band-critical: rgba(255, 124, 143, 0.2); --band-gap: rgba(232, 176, 79, 0.17);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5;
    padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  h3 { font-size: 14px; font-weight: 600; }
  p { margin: 0; }
  a { color: var(--accent); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .right { text-align: right; }
  .nowrap { white-space: nowrap; }
  .sp { flex: 1; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- struttura ---------- */
  .app { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100%; }
  .nav { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; overflow-y: auto; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .brand svg { flex: none; }
  .nav a.nl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  .nav a.nl:hover { background: var(--surface-2); }
  .nav a.nl[aria-current="page"] { background: var(--accent); color: var(--accent-fg); }
  .nav a.nl svg { flex: none; }
  .nav .foot { margin-top: auto; padding-top: 12px; display: grid; gap: 8px; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .top .sub { color: var(--muted); font-size: 12px; }
  .page { flex: 1; overflow: auto; padding: 20px 24px 48px; min-height: 0; }
  .syncchip { font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface-2); }
  .syncchip.warn { color: var(--warn); }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 4px; }
    .brand { display: none; }
    .nav a.nl { flex: none; padding: 7px 10px; }
    .nav .foot { margin: 0 0 0 auto; padding: 0; display: flex; }
    .top, .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }

  /* ---------- componenti ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
  .panel > h2 { margin-bottom: 12px; }
  .panel.flush { padding: 0; overflow: hidden; }
  .stack { display: grid; gap: 16px; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .grid2, .grid3, .split { grid-template-columns: minmax(0, 1fr); } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-family: var(--mono); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat b.pos { color: var(--ok); } .stat b.neg { color: var(--danger); }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; background: var(--surface-2); border-radius: 8px; padding: 3px; width: max-content; max-width: 100%; }
  .tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 500; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }

  input, select, textarea, button { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input, select, textarea { width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  input[type="number"], input.num { font-family: var(--mono); }
  input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
  input[type="color"] { padding: 2px; height: 32px; }
  button { cursor: pointer; width: auto; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  button.danger { color: var(--danger); }
  button.ghost { background: transparent; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  button.icon { padding: 4px 8px; background: transparent; border-color: transparent; color: var(--muted); }
  button.icon:hover:not(:disabled) { color: var(--fg); border-color: var(--line); }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .field > span.l { display: block; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--fg); }

  .scroll { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.t th { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
  table.t td.r, table.t th.r { text-align: right; }
  table.t tbody tr:hover { background: var(--surface-2); }
  table.t tr.click { cursor: pointer; }
  table.t td.act { white-space: nowrap; text-align: right; width: 1%; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: currentColor; background: transparent; }
  .chip.warn { color: var(--warn); border-color: currentColor; background: transparent; }
  .chip.bad { color: var(--danger); border-color: currentColor; background: transparent; }
  .chip.info { color: var(--info); border-color: currentColor; background: transparent; }
  .note { border-left: 3px solid var(--warn); background: var(--surface-2); padding: 8px 12px; border-radius: 0 6px 6px 0; }
  .note.bad { border-left-color: var(--danger); } .note.ok { border-left-color: var(--ok); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; flex: none; }

  /* ---------- finestre ---------- */
  .ov { position: fixed; inset: 0; background: rgba(8, 16, 14, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100% - 8px); display: flex; flex-direction: column; }
  .dlg.wide { width: min(940px, 100%); }
  .dlg > header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg > header h2 { flex: 1; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); }
  .dlg .dbody { padding: 16px; overflow: auto; display: grid; gap: 12px; align-content: start; }
  .dlg > footer { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
  .dlg .err { color: var(--danger); margin: 0; white-space: pre-line; }
  #toasts { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 8px; pointer-events: none; z-index: 70; padding: 0 16px; }
  .toast { background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 560px; pointer-events: auto; }
  .toast.bad { background: var(--danger); color: #fff; }
  #tip { position: fixed; z-index: 80; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: var(--shadow); font-size: 12px; max-width: 260px; }

  /* ---------- grafici ---------- */
  .chartbox { position: relative; }
  svg.ch text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
  svg.ch .grid { stroke: var(--line); stroke-width: 1; }
  .donutwrap { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 16px; align-items: center; }
  @media (max-width: 560px) { .donutwrap { grid-template-columns: minmax(0, 1fr); } }
  .donut circle.seg { fill: none; stroke-width: 26; cursor: pointer; transition: stroke-width .12s; }
  .donut circle.seg.on { stroke-width: 32; }
  .donut .ctr b { font-family: var(--mono); font-size: 15px; fill: var(--fg); font-weight: 500; }
  .legend { display: grid; gap: 2px; font-size: 13px; }
  .legend .li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: default; }
  .legend .li.on { background: var(--surface-2); }
  .legend .li .v { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- calendario ---------- */
  .cal { border: 1px solid var(--line); border-radius: 8px; overflow: auto; background: var(--surface); max-height: calc(100vh - 230px); min-height: 360px; }
  .calgrid { display: grid; position: relative; min-width: max-content; }
  .calhead { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 6px 8px; font-weight: 500; font-size: 13px; text-align: center; }
  .calhours { position: sticky; left: 0; z-index: 4; background: var(--surface); border-right: 1px solid var(--line); }
  .calhours div { font-size: 11px; color: var(--muted); font-family: var(--mono); padding: 0 6px; text-align: right; }
  .calcol { position: relative; border-left: 1px solid var(--line); min-width: 150px; cursor: cell;
    background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hh); }
  .calcol.today { background-color: var(--accent-soft); }
  .blk { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 7px; font-size: 12px; overflow: hidden; cursor: grab; color: #fff; border: 1px solid rgba(0,0,0,.25); touch-action: none; user-select: none; line-height: 1.3; }
  .blk b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk.tent { opacity: .65; border-style: dashed; }
  .blk.done { filter: saturate(.5); }
  .blk.cancel { opacity: .4; text-decoration: line-through; }
  .blk.bad { outline: 3px solid var(--danger); }
  .blk .rs { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
  .blk .rs::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 22px; margin-left: -11px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.7); }
  .nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--danger); z-index: 3; pointer-events: none; }

  /* ---------- editor planimetria / stage plot ---------- */
  .edwrap { display: grid; grid-template-columns: 200px minmax(0, 1fr) 270px; gap: 12px; align-items: start; }
  @media (max-width: 1180px) { .edwrap { grid-template-columns: minmax(0, 1fr); } }
  .palette { display: grid; gap: 4px; max-height: calc(100vh - 210px); overflow: auto; }
  .palette h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 2px; font-weight: 600; }
  .palette button { display: flex; gap: 8px; align-items: center; text-align: left; padding: 5px 8px; cursor: grab; }
  .palette button svg { flex: none; }
  .edcanvas { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; }
  .edcanvas svg.ed { display: block; width: 100%; height: min(70vh, 640px); min-height: 360px; touch-action: none; cursor: default; outline: none; }
  .edtools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .edtools .chk { font-size: 12px; }
  .edtools select { width: auto; padding: 3px 6px; }
  .legendrow { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  details.fold > summary { cursor: pointer; font-weight: 500; }
  @media (prefers-reduced-motion: no-preference) { button { transition: border-color .15s; } }

  /* ============ v2 · direzione artistica "sala di regia" ============
     Barra laterale scura come un pannello rack, una sola nota di colore ambra (la lampada del VU meter),
     intestazioni in Bricolage Grotesque, numeri e misure in IBM Plex Mono. */
  :root {
    --lamp: #c9741a; --lamp-bright: #f5b14c; --nav-bg: #0e1618; --nav-fg: #cbd8d5; --nav-muted: #7b908b; --nav-line: rgba(255,255,255,.08); --nav-hover: rgba(255,255,255,.06);
    --tl-bg: #0e1618; --tl-line: rgba(255,255,255,.075); --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lamp: #f5b14c; --nav-bg: #091011; } }
  :root[data-theme="dark"] { --lamp: #f5b14c; --nav-bg: #091011; }
  h1 { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .ic { flex: none; } .ic .ac { stroke: var(--lamp); } .ic .af { fill: var(--lamp); stroke: none; }

  .app { grid-template-columns: 236px minmax(0, 1fr); transition: grid-template-columns .22s ease; }
  .app.collapsed { grid-template-columns: 72px minmax(0, 1fr); }
  .nav { background: var(--nav-bg); color: var(--nav-fg); border-right: 0; padding: 16px 12px 12px; gap: 0; }
  .brand { padding: 2px 6px 6px; gap: 11px; }
  .brand .logo { flex: none; filter: drop-shadow(0 4px 10px rgba(15,118,110,.45)); }
  .brand .bname { display: grid; line-height: 1.2; min-width: 0; }
  .brand b { font-family: var(--display); font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .bname span { font-size: 11.5px; color: var(--nav-muted); white-space: nowrap; }
  .navlinks { display: block; }
  .navgrp { margin-top: 18px; display: grid; gap: 2px; }
  .navgrp .gl { font-size: 12px; color: var(--nav-muted); padding: 0 10px 5px; font-weight: 500; }
  .nav a.nl { position: relative; gap: 12px; padding: 9px 10px; border-radius: 10px; color: var(--nav-fg); font-weight: 500; transition: background .15s, color .15s; }
  .nav a.nl:hover { background: var(--nav-hover); color: #fff; }
  .nav a.nl[aria-current="page"] { background: rgba(255,255,255,.09); color: #fff; }
  .nav a.nl[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--lamp-bright); box-shadow: 0 0 14px 1px var(--lamp-bright); }
  .nav a.nl .ic .ac { stroke: var(--lamp-bright); } .nav a.nl .ic .af { fill: var(--lamp-bright); }
  .nav .foot { margin-top: auto; padding-top: 14px; display: grid; gap: 2px; border-top: 1px solid var(--nav-line); }
  .navbtn { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; border-radius: 10px; padding: 9px 10px; color: var(--nav-muted); text-align: left; font-weight: 500; }
  .navbtn:hover:not(:disabled) { background: var(--nav-hover); color: #fff; border: 0; }
  .navbtn .ic .ac, .navbtn .ic .af { stroke: var(--lamp-bright); }
  .navbtn .ic .af { fill: var(--lamp-bright); stroke: none; }
  .app.collapsed .bname, .app.collapsed .nl > span, .app.collapsed .gl, .app.collapsed .navbtn > span { display: none; }
  .app.collapsed .navgrp { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--nav-line); }
  .app.collapsed .navgrp:first-child { border-top: 0; padding-top: 0; }
  .app.collapsed .nl, .app.collapsed .navbtn { justify-content: center; padding-left: 0; padding-right: 0; }
  .app.collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }

  .top { gap: 10px 12px; padding: 14px 28px; background: transparent; border-bottom: 0; align-items: center; }
  .ttl { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .tt { display: grid; min-width: 0; }
  .tile { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(10,30,26,.04); }
  .top .sub { font-size: 12.5px; }

<script>
/* ====================================================================== icone

const icon = (n, size = 18) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;

'use strict';
/* ====================================================================== utilità */
const D = document;
const $ = (s, r = D) => r.querySelector(s);
const $$ = (s, r = D) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, n = 0) => { const k = 10 ** n; return Math.round(v * k) / k; };
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };

const _eur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', useGrouping: 'always' });
const eur = (c) => _eur.format((c || 0) / 100);
const _n2 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n2 = (v) => _n2.format(v);
const f1 = (v) => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const f2 = (v) => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');

/** "1.234,56" o "1234.56" -> centesimi. NaN se non valido. */
function parseMoney(s) {
  if (typeof s === 'number') return Math.round(s * 100);
  s = String(s ?? '').trim().replace(/[€\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) : NaN;
}
const moneyStr = (c) => (c / 100).toFixed(2).replace('.', ',');

/* date: 'YYYY-MM-DD' oppure 'YYYY-MM-DDTHH:mm' in ora locale (lo studio ha un solo fuso) */
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isoDT = (d) => `${isoDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDT = (s) => new Date(s.length <= 10 ? s + 'T00:00' : s);
const today = () => isoDate(new Date());
const fmtD = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '');
const fmtT = (s) => s.slice(11, 16);
const addDays = (iso, n) => { const d = parseDT(iso.slice(0, 10)); d.setDate(d.getDate() + n); return isoDate(d); };
const weekStart = (iso) => { const d = parseDT(iso.slice(0, 10)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDate(d); };
const minutesBetween = (a, b) => Math.round((parseDT(b) - parseDT(a)) / 60000);
const addMinutes = (dt, m) => { const d = parseDT(dt); d.setMinutes(d.getMinutes() + m); return isoDT(d); };
const DOW = ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'];
const MONTHS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const dowOf = (iso) => DOW[(parseDT(iso.slice(0, 10)).getDay() + 6) % 7];

const byKey = (k, dir = 1) => (a, b) => (a[k] > b[k] ? dir : a[k] < b[k] ? -dir : 0);
const sum = (arr, f = (x) => x) => arr.reduce((s, x) => s + (f(x) || 0), 0);

/* calcolo righe documento (preventivo, fattura): importi in centesimi */
function lineNet(l) { return Math.round(num(l.qty, 1) * (l.unit || 0) * (1 - num(l.disc, 0) / 100)); }
function lineVat(l) { return Math.round(lineNet(l) * num(l.vat, 0) / 100); }
function docTotals(lines) {
  const net = sum(lines, lineNet);
  const vat = sum(lines, lineVat);
  return { net, vat, total: net + vat };
}

/* ====================================================================== dati */
const COLS = ['clients', 'projects', 'sessions', 'rooms', 'staff', 'shifts', 'categories', 'suppliers', 'transactions',
  'quotations', 'invoices', 'payments', 'equipment', 'cables', 'patchbays', 'connections', 'rentals', 'ddts', 'materials', 'stageplots', 'cfg'];
const mem = Object.fromEntries(COLS.map((c) => [c, []]));
const storeListeners = new Set();
const store = {
  mode: 'local', // 'db' quando la capability db è disponibile
  ready: false,
  error: '',
  all: (c) => mem[c],
  get: (c, id) => mem[c].find((r) => r.id === id),
  on(fn) { storeListeners.add(fn); return () => storeListeners.delete(fn); },
};
let dbns = null;
const loadedCols = new Set();
const LKEY = (c) => 'studio.v1.' + c;

function notify(col) { storeListeners.forEach((f) => { try { f(col); } catch (e) { console.error(e); } }); }
function saveLocal(col) { try { localStorage.setItem(LKEY(col), JSON.stringify(mem[col])); } catch { /* storage non disponibile */ } }
function loadLocal() {
  for (const c of COLS) { try { const r = localStorage.getItem(LKEY(c)); if (r) mem[c] = JSON.parse(r); } catch { /* ignorato */ } }
}

/* scritture verso db: una alla volta per documento, al massimo 3 in parallelo, con nuovi tentativi */
const wq = new Map();

  for (let i = 0; ; i++) {

  const p = prev.then(async () => { await gate(); try { await retry(fn); } finally { release(); } }).catch(onWriteError);
  wq.set(key, p);
  p.then(() => { if (wq.get(key) === p) wq.delete(key); });
}
let lastErrToast = 0;

  if (Date.now() - lastErrToast < 4000) return;
  lastErrToast = Date.now();
  const code = e && e.code;
  toast(code === 'invalid_argument' ? 'Non hai il permesso di modificare questi dati.' : code === 'quota_exceeded' ? 'Archivio pieno: elimina qualche record.' : 'Salvataggio non riuscito. Riprova tra poco.', true);

const strip = (r) => JSON.parse(JSON.stringify(r));
store.put = function (col, rec) {
  if (!rec.id) rec.id = uid();
  rec.updatedAt = Date.now();
  const i = mem[col].findIndex((r) => r.id === rec.id);
  if (i >= 0) mem[col][i] = rec; else mem[col].push(rec);
  if (store.mode === 'db') enqueue(col + '/' + rec.id, () => dbns.collection(col).doc(rec.id).set(strip(rec)));
  else saveLocal(col);
  notify(col);
  return rec;
};
store.del = function (col, id) {
  const i = mem[col].findIndex((r) => r.id === id);
  if (i >= 0) mem[col].splice(i, 1);
  if (store.mode === 'db') enqueue(col + '/' + id, () => dbns.collection(col).doc(id).delete());
  else saveLocal(col);
  notify(col);
};

async function initStore() {
  let cap = null;
  try { cap = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { cap = null; }
  if (!cap) { loadLocal(); store.mode = 'local'; store.ready = true; notify('*'); return; }
  dbns = cap; store.mode = 'db';
  const timer = setTimeout(() => { if (!store.ready) { store.error = 'slow'; notify('*'); } }, 10000);
  for (const c of COLS) {
    try {
      dbns.collection(c).onSnapshot((snap) => {
        mem[c] = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
        loadedCols.add(c);
        if (!store.ready && loadedCols.size >= COLS.length) { store.ready = true; store.error = ''; clearTimeout(timer); }
        notify(c);
      }, (err) => { store.error = (err && err.code) || 'error'; loadedCols.add(c); notify('*'); });
    } catch (e) { console.error(e); loadedCols.add(c); }
  }
}

/** Finestra con modulo. onOk(dati, form) → true/undefined chiude, una stringa mostra l'errore. */
function modal({ title, html, wide, okLabel = 'Salva', onOk, onMount, extra = '', noOk }) {
  const ov = D.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="dlg${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button type="button" class="icon" data-close aria-label="Chiudi">✕</button></header>
    <form class="dbody" novalidate>${html}<p class="err" hidden></p></form>
    <footer>${extra}<span class="sp"></span><button type="button" data-close>${noOk ? 'Chiudi' : 'Annulla'}</button>${noOk ? '' : `<button type="button" class="primary" data-ok>${esc(okLabel)}</button>`}</footer></div>`;
  D.body.appendChild(ov);
  const form = $('form', ov), errEl = $('.err', ov);
  const api = { ov, form, close() { ov.remove(); D.removeEventListener('keydown', onKey); }, error(m) { errEl.textContent = m; errEl.hidden = !m; } };
  async function submit() {
    api.error('');
    const r = await onOk(formData(form), form, api);
    if (r === undefined || r === true) api.close(); else if (typeof r === 'string') api.error(r);
  }
  function onKey(e) { if (e.key === 'Escape' && D.body.lastElementChild === ov) api.close(); }

  ov.addEventListener('click', (e) => { if (e.target === ov && ov._down) api.close(); ov._down = false; if (e.target.closest('[data-close]')) api.close(); if (e.target.closest('[data-ok]')) submit(); });
  form.addEventListener('submit', (e) => { e.preventDefault(); if (!noOk) submit(); });
  D.addEventListener('keydown', onKey);
  if (onMount) onMount(form, api);
  const first = $('input:not([type=hidden]):not([readonly]), select, textarea', form); if (first) first.focus();
  return api;
}
function confirmBox(message, okLabel = 'Elimina') {
  return new Promise((res) => {
    let done = false;
    const m = modal({ title: 'Conferma', html: `<p>${esc(message)}</p>`, okLabel, onOk: () => { done = true; res(true); } });
    const orig = m.close; m.close = () => { orig(); if (!done) res(false); };
    $('footer [data-ok]', m.ov).classList.add('danger');

}

let dlns; let dlTried = false;

    try { const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' }); const a = D.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; D.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('File salvato: ' + filename); return true; } catch { /* ripiega sul testo */ }
  }
  if (!dlns) { if (fallbackText) showText(filename, fallbackText); else toast('Il salvataggio di file non è disponibile in questa vista.', true); return false; }
  try { await dlns.save({ filename, data }); toast('File salvato: ' + filename); return true; } catch (e) {

    return false;

}

  files.push({ name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });

function registerPage(name, def) { PAGES[name] = def; }
function pref(k, d) { try { const v = localStorage.getItem('studio.pref.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function setPref(k, v) { try { localStorage.setItem('studio.pref.' + k, JSON.stringify(v)); } catch { /* ignorato */ } }

let curName = null; let cur = null; let refreshQueued = false;
function mountPage() {
  const h = location.hash.slice(1);
  const name = PAGES[h] ? h : 'dashboard';
  if (cur && cur.unmount) { try { cur.unmount(); } catch (e) { console.error(e); } }
  curName = name; cur = PAGES[name];
  $$('#navlinks a').forEach((a) => (a.getAttribute('href') === '#' + name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  $('#pageTitle').textContent = cur.title; $('#pageIcon').innerHTML = icon(name, 22); syncTabbar(name);
  $('#pageSub').textContent = cur.sub || '';
  $('#topActions').innerHTML = '';
  D.title = cur.title + ' · ' + (getSettings().studioName || 'Studio Manager');
  const root = $('#page'); root.innerHTML = ''; root.scrollTop = 0;
  try { cur.render(root); } catch (e) { console.error(e); root.innerHTML = `<div class="note bad">Errore nel caricamento della pagina: ${esc(e.message)}</div>`; }
  decorateEmpty(root);
}
function refreshPage() {
  if (!cur || !cur.live || refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => {
    refreshQueued = false;
    const root = $('#page'); const a = D.activeElement; const id = a && a.id && root.contains(a) ? a.id : null;
    const ss = id && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null; const st = root.scrollTop;
    const sc = $$('.scroll, .cal', root).map((x) => [x.scrollLeft, x.scrollTop]);
    try { cur.render(root); } catch (e) { console.error(e); }
    decorateEmpty(root);
    root.scrollTop = st; $$('.scroll, .cal', root).forEach((x, i) => { if (sc[i]) { x.scrollLeft = sc[i][0]; x.scrollTop = sc[i][1]; } });
    if (id) { const n = D.getElementById(id); if (n) { n.focus(); if (ss) try { n.setSelectionRange(ss[0], ss[1]); } catch { /* ignorato */ } } }
  });
}
/** Ridisegna la pagina corrente anche se non è "live" (pagine con editor). */
function rerender() { if (!cur) return; try { cur.render($('#page')); decorateEmpty($('#page')); } catch (e) { console.error(e); } }
/** Aggiunge a ogni schermata vuota l'icona del modulo, così non è mai solo testo. */
function decorateEmpty(root) { $$('.empty', root).forEach((e) => { if (!e.querySelector('.ei')) e.insertAdjacentHTML('afterbegin', `<span class="ei">${icon(curName, 28)}</span>`); }); }
function updateChrome() {
  const s = getSettings();
  $('#studioName').textContent = s.studioName || 'Studio Manager';
  const chip = $('#syncChip');

  if (!store.ready) txt = 'Sincronizzazione…';
  else if (store.error) { txt = store.error === 'slow' ? 'Connessione lenta' : 'Dati non raggiungibili'; warn = true; }
  else if (store.mode === 'local') { txt = 'Dati solo su questo browser'; warn = true; }
  chip.hidden = !txt; chip.textContent = txt; chip.classList.toggle('warn', warn);
}

function pdfTable(ctx, cols, rows, o = {}) {

const PERIODS = [['month', 'Mese corrente'], ['quarter', 'Trimestre corrente'], ['year', 'Anno corrente'], ['12m', 'Ultimi 12 mesi'], ['all', 'Tutto']];
function periodRange(p) {
  const n = new Date(); const y = n.getFullYear(); const m = n.getMonth();
  if (p === 'month') return [isoDate(new Date(y, m, 1)), isoDate(new Date(y, m + 1, 0))];
  if (p === 'quarter') { const q = Math.floor(m / 3); return [isoDate(new Date(y, q * 3, 1)), isoDate(new Date(y, q * 3 + 3, 0))]; }
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  if (p === '12m') return [isoDate(new Date(y, m - 11, 1)), isoDate(new Date(y, m + 1, 0))];
  return ['0000-01-01', '9999-12-31'];
}
const periodLabel = (p) => (PERIODS.find((x) => x[0] === p) || [0, ''])[1];
const txInRange = (p) => { const [a, b] = periodRange(p); return store.all('transactions').filter((t) => t.date >= a && t.date <= b); };
const catColor = (c) => `var(--${(c && c.color) || 'c8'})`;
function invInfo(inv) {
  const total = docTotals(inv.lines).total;
  const paid = sum(store.all('payments').filter((p) => p.invoiceId === inv.id), (p) => p.amount);
  let st = inv.status === 'draft' ? 'draft' : paid >= total && total > 0 ? 'paid' : paid > 0 ? 'partial' : 'issued';
  const overdue = st !== 'draft' && st !== 'paid' && !!inv.due && inv.due < today();
  return { total, paid, left: Math.max(0, total - paid), st, overdue };
}
const INV_CHIP = { draft: ['', 'Bozza'], issued: ['info', 'Emessa'], partial: ['warn', 'Pagata in parte'], paid: ['ok', 'Pagata'] };
const invChip = (i) => `<span class="chip ${INV_CHIP[i.st][0]}">${INV_CHIP[i.st][1]}</span>${i.overdue ? ' <span class="chip bad">Scaduta</span>' : ''}`;
const Q_STATUS = { draft: 'Bozza', sent: 'Inviato', accepted: 'Accettato', rejected: 'Rifiutato', expired: 'Scaduto' };
const clientName = (id) => (store.get('clients', id) || {}).name || '(senza cliente)';

/* ---------- grafici ---------- */
function donutHtml(id, data, centerTitle) {
  const total = sum(data, (d) => d.value);
  if (!total) return `<div class="empty">Nessun dato nel periodo.</div>`;
  const R = 78; const C = 2 * Math.PI * R; let off = 0;
  const segs = data.map((d, i) => {
    const len = (d.value / total) * C; const gap = data.length > 1 ? 2 : 0;
    const el = `<circle class="seg" data-i="${i}" tabindex="0" cx="110" cy="110" r="${R}" stroke="${d.color}" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 110 110)" data-tip="<b>${esc(d.label)}</b><br>${eur(d.value)} · ${(d.value / total * 100).toFixed(1).replace('.', ',')}%" aria-label="${esc(d.label)}: ${eur(d.value)}"></circle>`;
    off += len; return el;
  }).join('');
  const legend = data.map((d, i) => `<div class="li" data-i="${i}"><span class="dot" style="background:${d.color}"></span><span>${esc(d.label)}</span><span class="v">${eur(d.value)}</span></div>`).join('');
  return `<div class="donutwrap" id="${id}" data-total="${total}" data-title="${esc(centerTitle)}">
    <svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${esc(centerTitle)}: ${eur(total)}"><circle cx="110" cy="110" r="${R}" fill="none" style="stroke:var(--surface-2)" stroke-width="26"></circle>${segs}
      <g class="ctr" text-anchor="middle"><text x="110" y="104" style="fill:var(--muted);font-size:11px" class="c-t">${esc(centerTitle)}</text><text x="110" y="124" class="c-v" style="font-family:var(--mono);font-size:15px;fill:var(--fg)">${eur(total)}</text></g></svg>
    <div class="legend">${legend}</div></div>`;
}
function bindDonut(root, data) {
  $$('.donutwrap', root).forEach((w) => {
    const total = +w.dataset.total; const t0 = w.dataset.title;
    const set = (i) => {
      $$('.seg,.li', w).forEach((e) => e.classList.toggle('on', i != null && +e.dataset.i === i));
      const d = i != null ? data[w.id][i] : null;
      $('.c-t', w).textContent = d ? d.label : t0; $('.c-v', w).textContent = eur(d ? d.value : total);
      let pct = $('.c-p', w); if (pct) pct.remove();
      if (d) { pct = D.createElementNS('http://www.w3.org/2000/svg', 'text'); pct.setAttribute('class', 'c-p'); pct.setAttribute('x', 110); pct.setAttribute('y', 142); pct.setAttribute('text-anchor', 'middle'); pct.setAttribute('style', 'font-size:12px;fill:var(--muted)'); pct.textContent = (d.value / total * 100).toFixed(1).replace('.', ',') + '%'; $('.ctr', w).appendChild(pct); }
    };
    w.addEventListener('mouseover', (e) => { const x = e.target.closest('[data-i]'); if (x) set(+x.dataset.i); });
    w.addEventListener('focusin', (e) => { const x = e.target.closest('[data-i]'); if (x) set(+x.dataset.i); });
    w.addEventListener('mouseleave', () => set(null)); w.addEventListener('focusout', () => set(null));
  });
}
function monthlyChart(txs) {
  const n = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(n.getFullYear(), n.getMonth() - i, 1); months.push({ key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, label: MONTHS[d.getMonth()], inc: 0, exp: 0 }); }
  for (const t of txs) { const m = months.find((x) => x.key === t.date.slice(0, 7)); if (m) m[t.kind === 'income' ? 'inc' : 'exp'] += t.amount; }
  const max = Math.max(1, ...months.map((m) => Math.max(m.inc, m.exp)));
  const step = [1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000].find((s) => max / 100 / s <= 5) || 1000000;
  const top = Math.ceil(max / 100 / step) * step * 100;
  const W = 640, H = 230, L = 46, B = 24, T = 10; const pw = W - L - 8; const ph = H - B - T;
  const y = (v) => T + ph - (v / top) * ph; const bw = pw / 12;
  let g = ''; for (let v = 0; v <= top; v += step * 100) g += `<line class="grid" x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 100000 ? Math.round(v / 100000) + 'k' : Math.round(v / 100)}</text>`;
  const bars = months.map((m, i) => {
    const x = L + i * bw; const w = bw * 0.34;
    const tip = `<b>${m.label} ${m.key.slice(0, 4)}</b><br>Entrate ${eur(m.inc)}<br>Uscite ${eur(m.exp)}<br>Saldo ${eur(m.inc - m.exp)}`;
    return `<g data-tip="${esc(tip)}"><rect x="${x}" y="0" width="${bw}" height="${H - B}" fill="transparent"/><rect x="${x + bw * 0.14}" y="${y(m.inc)}" width="${w}" height="${Math.max(0, T + ph - y(m.inc))}" rx="2" style="fill:var(--c1)"/><rect x="${x + bw * 0.14 + w + 2}" y="${y(m.exp)}" width="${w}" height="${Math.max(0, T + ph - y(m.exp))}" rx="2" style="fill:var(--c3)"/><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${m.label}</text></g>`;
  }).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entrate e uscite degli ultimi 12 mesi">${g}${bars}</svg>
    <div class="legendrow"><span><span class="dot" style="background:var(--c1)"></span>Entrate</span><span><span class="dot" style="background:var(--c3)"></span>Uscite</span><span class="mono">importi in €</span></div>`;
}

/* ---------- Oggi in studio: una corsia per sala, come la finestra di arrangiamento di un DAW ---------- */
function todayTimeline() {
  const rooms = store.all('rooms').filter((r) => live(r) && r.active !== false).sort(byKey('name')); const day = today(); const now = new Date(); const nowIso = isoDT(now);
  const ses = store.all('sessions').filter((x) => live(x) && x.status !== 'cancelled' && x.start.slice(0, 10) === day);
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1); const dateLabel = cap(now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }));
  const busy = rooms.filter((r) => ses.some((x) => (x.roomIds || []).includes(r.id) && x.start <= nowIso && x.end > nowIso)).length;
  const next = ses.filter((x) => x.start > nowIso).sort(byKey('start'))[0];
  const meta = [dateLabel, ses.length ? `${ses.length} ${ses.length === 1 ? 'sessione' : 'sessioni'}` : 'nessuna sessione', rooms.length ? `${busy} ${busy === 1 ? 'sala occupata' : 'sale occupate'} adesso` : ''].filter(Boolean).join(' · ');
  const head = `<div class="tl-head"><h2>Oggi in studio</h2><span class="meta">${esc(meta)}</span><span class="sp"></span><button type="button" class="sm" id="tlGo">Apri il calendario</button><button type="button" class="sm" id="tlNew">+ Nuova sessione</button></div>`;
  if (!rooms.length) return `<section class="tl" aria-label="Sessioni di oggi">${head}<div class="tl-empty">Aggiungi una sala da Booking per vedere qui la giornata.</div></section>`;
  const mins = (iso) => minutesBetween(day, iso);
  const s0 = clamp(Math.min(9, ...ses.map((x) => Math.floor(mins(x.start) / 60))), 0, 22); const e0 = clamp(Math.max(21, ...ses.map((x) => Math.ceil(mins(x.end) / 60))), s0 + 4, 24); const span = e0 - s0;
  const pct = (m) => clamp((m / 60 - s0) / span * 100, 0, 100); const step = span > 14 ? 2 : 1;
  const axis = Array.from({ length: span + 1 }, (_, i) => s0 + i).filter((h, i) => i % step === 0).map((h) => `<span style="left:${(h - s0) / span * 100}%">${pad(h)}</span>`).join('');
  const lanes = rooms.map((r) => `<div class="tl-lane" style="background-size:calc(100% / ${span}) 100%" data-room="${r.id}">${ses.filter((x) => (x.roomIds || []).includes(r.id)).map((x) => { const l = pct(mins(x.start)), w = Math.max(1.2, pct(mins(x.end)) - l);
    return `<button type="button" class="tl-clip${x.status === 'tentative' ? ' tent' : ''}" data-ses="${x.id}" style="left:${l}%;width:${w}%;background-color:var(--${r.color || 'c1'})" data-tip="<b>${esc(x.title || SESSION_TYPES[x.type])}</b><br>${esc(clientName(x.clientId))}<br>${fmtT(x.start)}–${fmtT(x.end)} · ${SES_STATUS[x.status]}">${esc(x.title || SESSION_TYPES[x.type])}<small>${esc(clientName(x.clientId))}</small></button>`; }).join('')}</div>`).join('');
  const nowMin = now.getHours() * 60 + now.getMinutes(); const nowLine = nowMin / 60 >= s0 && nowMin / 60 <= e0 ? `<div class="tl-now" style="left:${pct(nowMin)}%" data-tip="Adesso ${fmtT(nowIso)}"></div>` : '';
  const nextTxt = next ? `<div class="meta" style="margin-top:12px;color:#93a8a2;font-size:13px">Prossima: <b style="color:#fff;font-weight:600">${fmtT(next.start)}</b> · ${esc(next.title || SESSION_TYPES[next.type])} · ${esc((next.roomIds || []).map(roomName).join(', '))}</div>` : '';
  return `<section class="tl" aria-label="Sessioni di oggi">${head}<div class="tl-body"><div class="tl-names">${rooms.map((r) => `<div><i style="color:var(--${r.color || 'c1'});background:currentColor"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span></div>`).join('')}</div><div class="tl-track"><div class="tl-axis">${axis}</div>${lanes}${nowLine}</div></div>${nextTxt}</section>`;
}

const SESSION_TYPES = { recording: 'Registrazione', mixing: 'Mixaggio', mastering: 'Mastering', rehearsal: 'Prove', other: 'Altro' };
const SES_STATUS = { tentative: 'Provvisoria', confirmed: 'Confermata', done: 'Svolta', cancelled: 'Annullata' };

const HH = 44; // altezza di un'ora nel calendario, in pixel

/** Conflitti di una sessione: stessa sala (con pausa tra sessioni) o stesso fonico sovrapposti. */
function sessionConflicts(s, ignoreId) {
  if (s.status === 'cancelled') return [];
  const buf = getSettings().bufferMin || 0; const out = [];
  for (const o of store.all('sessions')) {
    if (!live(o) || o.status === 'cancelled' || o.id === ignoreId || o.id === s.id) continue;
    const sharedRooms = (s.roomIds || []).filter((r) => (o.roomIds || []).includes(r));
    if (sharedRooms.length && s.start < addMinutes(o.end, buf) && o.start < addMinutes(s.end, buf)) out.push({ kind: 'room', other: o, ids: sharedRooms });
    const sharedStaff = (s.staffIds || []).filter((r) => (o.staffIds || []).includes(r));
    if (sharedStaff.length && s.start < o.end && o.start < s.end) out.push({ kind: 'staff', other: o, ids: sharedStaff });
  }
  return out;
}
const conflictText = (c) => c.kind === 'room'
  ? `${c.ids.map(roomName).join(', ')} è già occupata da "${c.other.title || SESSION_TYPES[c.other.type]}" (${fmtD(c.other.start)} ${fmtT(c.other.start)}–${fmtT(c.other.end)}).`
  : `${c.ids.map(staffName).join(', ')} è già impegnato in "${c.other.title || SESSION_TYPES[c.other.type]}" (${fmtT(c.other.start)}–${fmtT(c.other.end)}).`;
/** Fonici assegnati fuori dal loro turno (solo avviso). */
function shiftWarnings(s) {
  const day = s.start.slice(0, 10); const out = [];
  for (const id of s.staffIds || []) {
    const sh = store.all('shifts').filter((x) => live(x) && x.staffId === id && x.date === day);
    if (!sh.some((x) => `${day}T${x.start}` <= s.start && `${day}T${x.end}` >= s.end)) out.push(`${staffName(id)} non ha un turno che copre ${fmtT(s.start)}–${fmtT(s.end)}.`);
  }
  return out;
}
function shiftConflict(sh, ignoreId) {
  return store.all('shifts').find((o) => live(o) && o.id !== ignoreId && o.staffId === sh.staffId && o.date === sh.date && sh.start < o.end && o.start < sh.end);
}

function layoutLanes(blocks) {
  blocks.sort((a, b) => (a.s - b.s) || (b.e - a.e)); const lanes = [];
  for (const b of blocks) { let i = lanes.findIndex((end) => end <= b.s); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = b.e; b.lane = i; }
  for (const b of blocks) { b.lanes = Math.max(...blocks.filter((o) => o.s < b.e && b.s < o.e).map((o) => o.lane)) + 1; }
}

/* ====================================================================== Clienti (CRM) */
const PROJ_STATUS = { quote: 'Preventivo', in_progress: 'In lavorazione', delivered: 'Consegnato', archived: 'Archiviato' };
/** Fatturato e incassato di un cliente (o di un progetto). Le bozze non contano. */
function clientFin(clientId, projectId) {
  const invs = store.all('invoices').filter((i) => live(i) && i.status !== 'draft' && (projectId ? i.projectId === projectId : i.clientId === clientId));
  const billed = sum(invs, (i) => docTotals(i.lines).total);
  const paid = sum(store.all('payments').filter((p) => invs.some((i) => i.id === p.invoiceId)), (p) => p.amount);
  return { billed, paid, left: Math.max(0, billed - paid) };
}
function payChip(fin, budget) {
  if (!fin.billed) return `<span class="chip">${budget ? 'Non fatturato' : '—'}</span>`;
  if (fin.paid >= fin.billed) return '<span class="chip ok">Pagato</span>';
  const late = store.all('invoices').some((i) => live(i) && i.status !== 'draft' && invInfo(i).overdue && fin.billed);
  return fin.paid > 0 ? '<span class="chip warn">Pagato in parte</span>' : `<span class="chip ${late ? 'bad' : 'info'}">Da incassare</span>`;
}

registerPage('clienti', {
  label: 'Clienti', title: 'Clienti', sub: 'Anagrafica, progetti, sessioni e pagamenti', live: true,
  render(root) {
    const sel = pref('crmSel', ''); const c = store.get('clients', sel);
    if (c && live(c)) return clientDetail(root, c);

      <section class="panel stack"><h2>Tempo di riverbero RT60</h2><div class="chartbox">${rtChart(rt, tgt)}</div>

        <p class="small muted">Obiettivo indicativo per ${ROOM_KINDS[room.kind] || 'questa stanza'}: ${f2(tgt[0])}–${f2(tgt[1])} s${rt.schroeder ? ` · frequenza di Schroeder ≈ ${Math.round(rt.schroeder)} Hz (sopra: campo diffuso, sotto: dominano i modi)` : ''}. Calcolo con superfici miste: ogni superficie è la somma di porzione nuda e porzioni trattate. Non include l'assorbimento dell'aria, di persone e arredi.</p></section>

    bindRoomPicker(root); $('#goPlan', root).onclick = () => (location.hash = 'planimetria');
    const upd = (patch) => store.put('rooms', { ...store.get('rooms', room.id), ...patch });

      const m = e.target.closest('[data-m]'); if (m) return materialModal(store.get('materials', m.dataset.m));
      const b = e.target.closest('[data-a]'); if (!b) return; const tr = b.closest('tr[data-t]'); const r = store.get('rooms', room.id); const t = r.treatments.find((x) => x.id === tr.dataset.t);
      if (b.dataset.a === 'del') { if (!await confirmBox('Eliminare il trattamento' + (t.fpId ? ' e il suo elemento in planimetria' : '') + '?')) return; store.put('rooms', { ...r, treatments: r.treatments.filter((x) => x.id !== t.id), plan: { ...r.plan, items: (r.plan.items || []).filter((i) => i.id !== t.fpId) } }); }
      if (b.dataset.a === 'show') { setPref('planSel', t.fpId); location.hash = 'planimetria'; }

});

/** Crea in planimetria l'elemento corrispondente a un trattamento manuale, e lo collega. */
function placeTreatmentOnPlan(room, t) {
  const d = room.dims; const area = t.areaM2 || 1.2; const hgt = 1200; const len = clamp(Math.round(area * 1e6 / hgt / 10) * 10, 300, 3000); const th = 100; const s = t.surface;
  let it = { id: uid(), type: 'pannello', w: len, h: th, rot: 0, hgt, label: t.label || 'Pannello', treatmentId: t.id, x: d.W / 2, y: th / 2 };
  if (s === 'south') it = { ...it, y: d.L - th / 2 }; else if (s === 'west') it = { ...it, rot: 90, x: th / 2, y: d.L / 2 }; else if (s === 'east') it = { ...it, rot: 90, x: d.W - th / 2, y: d.L / 2 };
  else if (s === 'ceiling') it = { ...it, type: 'nuvola', w: Math.round(Math.sqrt(area) * 1000), h: Math.round(Math.sqrt(area) * 1000), x: d.W / 2, y: d.L / 2, label: t.label || 'Nuvola' };
  else if (s === 'floor') it = { ...it, type: 'tappeto', w: Math.round(Math.sqrt(area) * 1000), h: Math.round(Math.sqrt(area) * 1000), x: d.W / 2, y: d.L / 2, label: t.label || 'Tappeto' };
  store.put('rooms', { ...room, plan: { ...room.plan, items: [...(room.plan.items || []), it] }, treatments: room.treatments.map((x) => (x.id === t.id ? { ...x, fpId: it.id, surface: undefined } : x)) });
}
function treatmentModal(room) {
  const mats = store.all('materials').filter((m) => m.category === 'Assorbitore' || m.category === 'Diffusore').sort(byKey('name'));
  modal({ title: 'Nuovo trattamento', html: `<div class="fgrid">${fInput('label', 'Nome', '', 'placeholder="es. Pannelli parete nord"')}${fSelect('materialId', 'Materiale', mats.map((m) => [m.id, m.name]), (mats[0] || {}).id)}${fSelect('surface', 'Superficie', [...Object.entries(SURFACES), ['free', 'Pannello libero (non a parete)']], 'north')}${fInput('area', 'Area (m²)', '', 'inputmode="decimal" placeholder="es. 3,6"')}${fCheck('place', 'Disegnalo subito in planimetria', true)}</div>`,
    onOk(d) {
      const area = num(d.area, 0); if (!(area > 0)) return 'Indica un\'area maggiore di zero.'; if (!d.materialId) return 'Scegli il materiale.';
      const r = store.get('rooms', room.id); const t = { id: uid(), label: d.label.trim() || 'Trattamento', materialId: d.materialId, surface: d.surface, areaM2: area };
      const r2 = store.put('rooms', { ...r, treatments: [...r.treatments, t] }); if (d.place) placeTreatmentOnPlan(r2, t);
    } });
}
function materialModal(m) {
  const isNew = !m; m = m || { name: '', category: 'Assorbitore', alpha: [0.1, 0.2, 0.4, 0.6, 0.7, 0.7] };
  const api = modal({ title: isNew ? 'Nuovo materiale' : 'Modifica materiale', wide: true, html: `<div class="fgrid">${fInput('name', 'Nome', m.name)}${fSelect('category', 'Categoria', ['Superficie', 'Pavimento', 'Assorbitore', 'Diffusore'], m.category)}</div><div class="fgrid">${BANDS.map((b, i) => fInput('a' + i, `α ${b >= 1000 ? b / 1000 + ' kHz' : b + ' Hz'}`, String(m.alpha[i]).replace('.', ','), 'inputmode="decimal"')).join('')}</div><p class="small muted">Valori da 0 (riflette tutto) a 1 (assorbe tutto).</p>`,
    extra: isNew ? '' : '<button type="button" class="danger" id="delMat">Elimina</button>',
    onMount() { const d = $('#delMat', D); if (d) d.onclick = async () => { const used = store.all('rooms').some((r) => Object.values(r.surfaces || {}).includes(m.id) || (r.treatments || []).some((t) => t.materialId === m.id)); if (used) return api.error('Il materiale è usato in una o più stanze.'); if (await confirmBox('Eliminare il materiale?')) { store.del('materials', m.id); api.close(); } }; },
    onOk(d) { if (!d.name.trim()) return 'Indica il nome.'; const alpha = BANDS.map((_, i) => num(d['a' + i], NaN)); if (alpha.some((a) => !(a >= 0 && a <= 1))) return 'I coefficienti devono essere numeri tra 0 e 1.'; store.put('materials', { ...m, name: d.name.trim(), category: d.category, alpha, builtin: false }); } });
}

/* ---------- grafici ---------- */
function modesChart(modes, clusters, schroeder) {
  const W = 680, H = 230, L = 40, R = 10, T = 12, B = 34; const pw = W - L - R, ph = H - T - B; const x = (f) => L + (f - 20) / 280 * pw;
  let g = ''; for (let f = 20; f <= 300; f += f < 100 ? 20 : 50) g += `<line class="grid" x1="${x(f)}" x2="${x(f)}" y1="${T}" y2="${T + ph}"/><text x="${x(f)}" y="${H - 18}" text-anchor="middle">${f}</text>`;
  g += `<text x="${L + pw / 2}" y="${H - 3}" text-anchor="middle">Frequenza (Hz)</text>`;
  const band = clusters.map((c) => `<rect x="${x(Math.max(20, c.f0)) - 3}" y="${T}" width="${Math.max(6, x(c.f1) - x(c.f0) + 6)}" height="${ph}" style="fill:var(--${c.degenerate ? 'danger' : 'band-critical'})" opacity="${c.degenerate ? 0.3 : 1}" ${c.degenerate ? '' : ''}/>`).join('').replace(/style="fill:var\(--band-critical\)"/g, 'style="fill:var(--band-critical)"');
  const hgt = { axial: 1, tangential: 0.62, oblique: 0.34 }; const colr = { axial: 'axial', tangential: 'tangential', oblique: 'oblique' };
  const stems = modes.filter((m) => m.f >= 20).map((m) => { const yy = T + ph * (1 - hgt[m.type]);
    return `<g data-tip="<b>${f2(m.f)} Hz</b><br>modo (${m.n.join(', ')})<br>${{ axial: 'assiale', tangential: 'tangenziale', oblique: 'obliquo' }[m.type]}"><rect x="${x(m.f) - 4}" y="${T}" width="8" height="${ph}" fill="transparent"/><line x1="${x(m.f)}" x2="${x(m.f)}" y1="${T + ph}" y2="${yy}" style="stroke:var(--${colr[m.type]})" stroke-width="2.2" stroke-linecap="round"/></g>`; }).join('');
  const sch = schroeder && schroeder <= 300 && schroeder >= 20 ? `<line x1="${x(schroeder)}" x2="${x(schroeder)}" y1="${T}" y2="${T + ph}" style="stroke:var(--fg)" stroke-dasharray="4 3"/><text x="${x(schroeder) + 4}" y="${T + 10}" text-anchor="start">Schroeder ${Math.round(schroeder)} Hz</text>` : '';
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Modi propri della stanza fra 20 e 300 Hz">${g}${band}${stems}${sch}<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" style="stroke:var(--muted)"/></svg>`;
}
function rtChart(rt, tgt) {
  const W = 680, H = 240, L = 44, R = 14, T = 14, B = 34; const pw = W - L - R, ph = H - T - B;
  const vals = [...rt.sabine, ...rt.eyring].filter(Number.isFinite); const top = Math.max(1, tgt[1] * 1.4, ...vals.map((v) => Math.min(v, 5))); const ymax = Math.min(6, Math.ceil(top * 4) / 4);
  const x = (i) => L + pw * (i + 0.5) / BANDS.length; const y = (v) => T + ph * (1 - Math.min(v, ymax) / ymax);
  let g = ''; const step = ymax > 3 ? 1 : ymax > 1.5 ? 0.5 : 0.25; for (let v = 0; v <= ymax + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${f2(v)}</text>`;
  g += BANDS.map((b, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle">${b >= 1000 ? b / 1000 + 'k' : b}</text>`).join('') + `<text x="${L + pw / 2}" y="${H - 1}" text-anchor="middle">Banda d'ottava (Hz)</text><text x="12" y="${T + ph / 2}" transform="rotate(-90 12 ${T + ph / 2})" text-anchor="middle">RT60 (s)</text>`;
  const band = `<rect x="${L}" y="${y(tgt[1])}" width="${pw}" height="${y(tgt[0]) - y(tgt[1])}" style="fill:var(--ok)" opacity=".13"/><text x="${W - R - 4}" y="${y(tgt[1]) + 12}" text-anchor="end" style="fill:var(--ok)">obiettivo</text>`;
  const line = (arr, c, nm) => { const pts = arr.map((v, i) => [x(i), y(Number.isFinite(v) ? v : ymax)]); return `<polyline fill="none" style="stroke:var(--${c})" stroke-width="2.2" points="${pts.map((p) => p.join(',')).join(' ')}"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:var(--${c})" data-tip="<b>${nm}</b> · ${BANDS[i]} Hz<br>RT60 ${Number.isFinite(arr[i]) ? f2(arr[i]) : '∞'} s"/>`).join(''); };
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="RT60 per banda d'ottava">${g}${band}${line(rt.sabine, 'c2', 'Sabine')}${line(rt.eyring, 'c3', 'Eyring')}</svg><div class="legendrow"><span><span class="dot" style="background:var(--c2)"></span>Sabine</span><span><span class="dot" style="background:var(--c3)"></span>Eyring</span><span><span class="dot" style="background:var(--ok);opacity:.4"></span>Fascia obiettivo</span></div>`;
}

/** Allinea trattamenti e planimetria in un solo salvataggio: crea i trattamenti dei nuovi elementi, toglie quelli orfani. */
function persistPlan(roomId, items) {
  const r = store.get('rooms', roomId); if (!r) return; let tr = [...(r.treatments || [])];
  for (const it of items) {
    if (!isAcoustic(it.type)) continue; if (!it.treatmentId) it.treatmentId = uid();
    const t = tr.find((x) => x.id === it.treatmentId);
    if (!t) tr.push({ id: it.treatmentId, label: it.label, materialId: (matByName(DEFAULT_MAT[it.type]) || {}).id || '', fpId: it.id });
    else if (t.label !== it.label || t.fpId !== it.id) tr = tr.map((x) => (x === t ? { ...x, label: it.label, fpId: it.id } : x));
  }
  tr = tr.filter((t) => !t.fpId || items.some((i) => i.id === t.fpId));
  store.put('rooms', { ...r, plan: { ...(r.plan || {}), items }, treatments: tr });
}

/* ---------- PDF ---------- */
function pdfDrawItems(p, items, lib, map, scale, fs = 6) {
  for (const it of items) {
    const c = Math.cos((it.rot || 0) * Math.PI / 180), s = Math.sin((it.rot || 0) * Math.PI / 180);
    const pts = [[-it.w / 2, -it.h / 2], [it.w / 2, -it.h / 2], [it.w / 2, it.h / 2], [-it.w / 2, it.h / 2]].map(([x, y]) => map(it.x + x * c - y * s, it.y + x * s + y * c));
    p.poly(pts, { fill: '#dfe7e4', stroke: '#33413d', lw: 0.6 });
    if (!it.label) continue; const [cx, cy] = map(it.x, it.y); const tw = textWidth(it.label, fs, false);
    const hy = (Math.abs(it.w * s) + Math.abs(it.h * c)) / 2 * scale;
    if (tw < it.w * scale * 0.92 && fs * 1.4 < it.h * scale && !((lib[it.type] || {}).z < 0)) p.text(cx, cy + fs * 0.35, it.label, { size: fs, align: 'center' });
    else p.text(cx, (((lib[it.type] || {}).z < 0) ? cy - hy + fs * 1.3 : cy + hy + fs * 1.1), it.label, { size: fs, align: 'center', color: '#222222' });
  }
}
function buildPlanPdf(room, items) {
  const ctx = pdfStart('PLANIMETRIA', [room.name, `${f1(room.dims.W / 1000)} × ${f1(room.dims.L / 1000)} × ${f1(room.dims.H / 1000)} m`, `Emessa il ${fmtD(today())}`]); const p = ctx.p; const d = room.dims;
  const boxW = PG.w - 2 * PG.m, boxH = 430; const sc = Math.min((boxW - 40) / d.W, (boxH - 40) / d.L); const ox = PG.m + (boxW - d.W * sc) / 2, oy = ctx.y + 20;
  const map = (x, y) => [ox + x * sc, oy + y * sc];
  p.rect(ox, oy, d.W * sc, d.L * sc, { fill: '#ffffff', stroke: '#111111', lw: 2 });
  p.text(ox + d.W * sc / 2, oy - 6, `Nord · ${d.W} mm`, { size: 7, align: 'center', color: '#555555' }); p.text(ox - 6, oy + d.L * sc / 2, `${d.L} mm`, { size: 7, align: 'right', color: '#555555' });
  pdfDrawItems(p, items, LIB_PLAN, map, sc);
  ctx.y = oy + d.L * sc + 28;
  const rt = computeRT60({ ...room, plan: { items } }); const rtmp = { ...room, plan: { items } };
  const rows = (room.treatments || []).map((t) => [t.label || '', (store.get('materials', t.materialId) || {}).name || '', SURFACES[treatmentSurface(rtmp, t)] || 'Libero', f2(treatmentArea(rtmp, t)) + ' m²']);
  if (rows.length) pdfTable(ctx, [{ label: 'Trattamento', x: PG.m, w: 170 }, { label: 'Materiale', x: PG.m + 170, w: 190 }, { label: 'Superficie', x: PG.m + 360, w: 90 }, { label: 'Area', x: PG.m + 450, w: PG.w - 2 * PG.m - 450, align: 'right' }], rows, { reserve: 120 });
  if (ctx.y + 70 > PG.bottom) { ctx.p = ctx.doc.addPage(); ctx.y = 60; }
  ctx.y += 14; ctx.p.text(PG.m, ctx.y, 'RT60 (s)', { size: 9, bold: true });
  BANDS.forEach((b, i) => { const x = PG.m + 70 + i * 70; ctx.p.text(x, ctx.y, b + ' Hz', { size: 8, color: '#555555' }); ctx.p.text(x, ctx.y + 12, 'Sabine ' + f2(rt.sabine[i]), { size: 8 }); ctx.p.text(x, ctx.y + 23, 'Eyring ' + f2(rt.eyring[i]), { size: 8 }); });
  pdfFooter(ctx.doc, 'Planimetria generata da Studio Manager. Coefficienti di assorbimento indicativi.');
  return ctx.doc;
}

let cmdItems = []; let cmdSel = 0; let cmdPrevFocus = null;
function cmdBuild(q) {
  const t = norm(q).split(/\s+/).filter(Boolean); const ok = (s) => t.every((w) => norm(s).includes(w)); const groups = [];
  const add = (name, list) => { if (list.length) groups.push([name, list]); };
  add('Crea', ACTIONS.filter((a) => ok(a.label)).slice(0, t.length ? 6 : 9).map((a) => ({ title: a.label, icon: a.icon, hint: 'Crea', run: () => runAction(a) })));
  add('Vai a', PAGE_ORDER.filter((n) => PAGES[n] && ok(PAGES[n].label + ' ' + (PAGES[n].sub || ''))).map((n) => ({ title: PAGES[n].label, sub: PAGES[n].sub, icon: n, hint: 'Apri', run: () => { location.hash = n; } })));
  if (t.length) {
    add('Clienti', store.all('clients').filter((c) => live(c) && ok([c.name, c.email, c.vat, c.phone].join(' '))).slice(0, 5).map((c) => ({ title: c.name, sub: [c.email, c.phone].filter(Boolean).join(' · '), icon: 'user', hint: 'Cliente', run: () => { setPref('crmSel', c.id); if (location.hash === '#clienti') refreshPage(); else location.hash = 'clienti'; } })));
    add('Attrezzatura', store.all('equipment').filter((e) => live(e) && ok([e.name, e.maker, e.serial, e.type].join(' '))).slice(0, 5).map((e) => ({ title: e.name, sub: [e.maker, e.serial].filter(Boolean).join(' · '), icon: 'magazzino', hint: EQ_STATUS[e.status], run: () => { setPref('invTab', 'attrezzatura'); setPref('eqFilter', { q: e.name, type: '', status: '' }); if (location.hash === '#magazzino') refreshPage(); else location.hash = 'magazzino'; } })));
    add('Sessioni', store.all('sessions').filter((s) => live(s) && ok([s.title, SESSION_TYPES[s.type], clientName(s.clientId)].join(' '))).sort(byKey('start', -1)).slice(0, 4).map((s) => ({ title: s.title || SESSION_TYPES[s.type], sub: `${fmtD(s.start)} ${fmtT(s.start)} · ${clientName(s.clientId)}`, icon: 'booking', hint: 'Sessione', run: () => { calState.date = s.start.slice(0, 10); calState.view = 'day'; setPref('bookTab', 'calendario'); if (location.hash === '#booking') refreshPage(); else location.hash = 'booking'; } })));
  }
  add('Strumenti', TOOLS.filter((a) => ok(a.label)).map((a) => ({ title: a.label, icon: a.icon, hint: '', run: a.run })));
  return groups;
}
function cmdRender() {
  const groups = cmdBuild($('#cmdkIn').value); cmdItems = []; let h = '';
  for (const [g, list] of groups) { h += `<div class="cmdk-g">${g}</div>`; for (const it of list) { h += `<button type="button" class="cmdk-i" role="option" data-n="${cmdItems.length}"><span class="tl2">${icon(it.icon, 18)}</span><span class="tx"><span>${esc(it.title)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span><span class="hint">${esc(it.hint || '')}</span></button>`; cmdItems.push(it); } }
  $('#cmdkList').innerHTML = h || `<div class="empty" style="padding:28px">Nessun risultato. Prova con il nome di un cliente o di un modulo.</div>`;
  cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1)); cmdMark();
}
function cmdMark() { $$('.cmdk-i', cmdk).forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.n === cmdSel))); const s = $('.cmdk-i[aria-selected="true"]', cmdk); if (s) s.scrollIntoView({ block: 'nearest' }); }
function cmdOpen() { closePop(); cmdPrevFocus = D.activeElement; cmdk.hidden = false; $('#cmdkIn').value = ''; cmdSel = 0; cmdRender(); $('#cmdkIn').focus(); }
function cmdClose() { if (cmdk.hidden) return; cmdk.hidden = true; if (cmdPrevFocus && cmdPrevFocus.focus) try { cmdPrevFocus.focus(); } catch { /* ignorato */ } }
function cmdRun(n) { const it = cmdItems[n]; if (!it) return; cmdClose(); setTimeout(it.run, 30); }
$('#cmdkIn').addEventListener('input', () => { cmdSel = 0; cmdRender(); });
cmdk.addEventListener('click', (e) => { if (e.target === cmdk) return cmdClose(); const b = e.target.closest('.cmdk-i'); if (b) cmdRun(+b.dataset.n); });
cmdk.addEventListener('mousemove', (e) => { const b = e.target.closest('.cmdk-i'); if (b && +b.dataset.n !== cmdSel) { cmdSel = +b.dataset.n; cmdMark(); } });
cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); cmdClose(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdItems.length - 1, cmdSel + 1); cmdMark(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(0, cmdSel - 1); cmdMark(); }
  else if (e.key === 'Enter') { e.preventDefault(); cmdRun(cmdSel); }
});
D.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.hidden ? cmdOpen() : cmdClose(); }
  else if (e.key === '/' && !typing && !D.querySelector('.ov') && cmdk.hidden) { e.preventDefault(); cmdOpen(); }
});

/* ---------- menu "Nuovo" ---------- */
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; $('#newBtn').setAttribute('aria-expanded', 'false'); } }
function openPop() {
  if (popEl) return closePop();
  const b = $('#newBtn'); const r = b.getBoundingClientRect(); popEl = D.createElement('div'); popEl.className = 'pop'; popEl.setAttribute('role', 'menu');
  popEl.innerHTML = ACTIONS.map((a, i) => `<button type="button" role="menuitem" data-i="${i}">${icon(a.icon, 18)}<span>${a.label}</span></button>`).join('');
  D.body.appendChild(popEl); popEl.style.top = r.bottom + 8 + 'px'; popEl.style.left = Math.max(8, Math.min(innerWidth - popEl.offsetWidth - 8, r.right - popEl.offsetWidth)) + 'px';
  b.setAttribute('aria-expanded', 'true'); $('button', popEl).focus();
  popEl.addEventListener('click', (e) => { const x = e.target.closest('[data-i]'); if (x) { closePop(); runAction(ACTIONS[+x.dataset.i]); } });
  popEl.addEventListener('keydown', (e) => { const bs = $$('button', popEl); const i = bs.indexOf(D.activeElement); if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); } if (e.key === 'Escape') { closePop(); b.focus(); } });
}
D.addEventListener('pointerdown', (e) => { if (popEl && !popEl.contains(e.target) && !e.target.closest('#newBtn')) closePop(); });
window.addEventListener('resize', closePop);

/* ---------- intestazione, menu compatto, barra in basso ---------- */
$('.si').innerHTML = icon('search', 18); $('.pi').innerHTML = icon('plus', 18);
$('#kbdHint').textContent = IS_MAC ? '⌘ K' : 'Ctrl K';
$('#searchBtn').onclick = cmdOpen; $('#newBtn').onclick = openPop;
function setCollapsed(c) { $('#app').classList.toggle('collapsed', c); $('#collapseBtn').innerHTML = icon(c ? 'expand' : 'collapse', 20) + '<span>Comprimi il menu</span>'; $('#collapseBtn').setAttribute('aria-label', c ? 'Espandi il menu' : 'Comprimi il menu'); }
setCollapsed(pref('navCollapsed', false));
$('#collapseBtn').onclick = () => { const c = !$('#app').classList.contains('collapsed'); setPref('navCollapsed', c); setCollapsed(c); };
D.addEventListener('click', (e) => {
  if (!e.target.closest('#moreBtn')) return;
  const rest = PAGE_ORDER.filter((n) => PAGES[n] && !TAB_MAIN.includes(n));
  const api = modal({ title: 'Altri moduli', noOk: true, html: `<div class="stack">${rest.map((n) => `<a class="cmdk-i" style="text-decoration:none;color:inherit" href="#${n}" data-go><span class="tl2">${icon(n, 20)}</span><span class="tx"><span>${esc(PAGES[n].label)}</span><small>${esc(PAGES[n].sub || '')}</small></span></a>`).join('')}
    <div class="row"><button type="button" class="sm" data-act="theme">${icon('contrast', 16)} Cambia tema</button><button type="button" class="sm" data-act="set">${icon('settings', 16)} Dati dello studio</button><button type="button" class="sm" data-act="bk">${icon('backup', 16)} Copia di sicurezza</button></div></div>`,
    onMount(form) { form.addEventListener('click', (ev) => { const g = ev.target.closest('[data-go]'); const a = ev.target.closest('[data-act]'); if (g) setTimeout(() => api.close(), 0); if (a) { api.close(); setTimeout(() => ({ theme: () => $('#themeBtn').click(), set: settingsModal, bk: exportBackup })[a.dataset.act](), 60); } }); } });
});

/* ====================================================================== avvio */
(function start() {
  buildNav();
  applyTheme(themeMode());
  $('#themeBtn').onclick = () => { const order = ['system', 'light', 'dark']; const n = order[(order.indexOf(themeMode()) + 1) % 3]; try { localStorage.setItem(THEME_KEY, n); } catch { /* ignorato */ } applyTheme(n); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themeMode() === 'system') applyTheme('system'); });
  window.addEventListener('hashchange', mountPage);
  initStore().then(() => { updateChrome(); mountPage(); });
  mountPage();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body></html>
